<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d12">
<title>AudioHub</title>

<style>
:root{
  --bg:#0b0d12;
  --panel:#121620;
  --panel2:#181d29;
  --text:#f5f7fb;
  --muted:#9aa3b2;
  --line:#252c39;
  --accent:#7c5cff;
  --danger:#ff5c70;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
}

body{min-height:100vh}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{
  max-width:1100px;
  margin:auto;
  padding:18px 16px 115px
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px
}

.brand{
  font-weight:800;
  font-size:23px;
  letter-spacing:-.5px
}

.brand span{color:#9b86ff}

.icon-btn{
  width:44px;
  height:44px;
  font-size:20px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:14px
}

.search{
  display:flex;
  gap:10px;
  margin-bottom:18px
}

.search input{
  flex:1;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px 15px;
  color:var(--text);
  outline:none
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:20px
}

.tab{
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  padding:9px 13px;
  border-radius:999px;
  white-space:nowrap
}

.tab.active{
  background:var(--text);
  color:#0b0d12;
  border-color:var(--text)
}

.page-title{
  font-size:25px;
  font-weight:800;
  margin:8px 0 5px
}

.page-sub{
  color:var(--muted);
  margin:0 0 20px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px
}

.card{
  background:linear-gradient(145deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  border-radius:19px;
  padding:17px
}

.playlist-card{
  min-height:165px;
  display:flex;
  flex-direction:column;
  justify-content:space-between
}

.playlist-icon{
  font-size:31px;
  margin-bottom:12px
}

.card h3{
  margin:0 0 7px;
  font-size:18px
}

.card p{
  margin:0;
  color:var(--muted);
  font-size:14px;
  line-height:1.45
}

.open-btn{
  margin-top:15px;
  width:100%;
  padding:11px;
  border:0;
  border-radius:12px;
  background:#242b3a;
  color:var(--text);
  font-weight:700
}

.track{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:15px;
  margin-bottom:10px
}

.cover{
  width:52px;
  height:52px;
  border-radius:12px;
  background:#222938;
  display:grid;
  place-items:center;
  font-weight:800;
  flex:0 0 auto
}

.track-info{
  min-width:0;
  flex:1
}

.track-title{
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.track-sub{
  font-size:13px;
  color:var(--muted);
  margin-top:3px
}

.track-actions{
  display:flex;
  gap:6px
}

.small-btn{
  width:38px;
  height:38px;
  border:1px solid var(--line);
  background:#1b2130;
  color:var(--text);
  border-radius:11px
}

.small-btn.active{color:#ff6d83}

.empty{
  padding:35px 18px;
  text-align:center;
  border:1px dashed var(--line);
  border-radius:17px;
  color:var(--muted)
}

.hidden{display:none!important}

.back{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:none;
  border:0;
  color:var(--muted);
  padding:4px 0 15px
}

.player{
  position:fixed;
  left:0;
  right:0;
  bottom:64px;
  background:rgba(15,18,26,.97);
  backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:11px 15px;
  z-index:20
}

.player-inner{
  max-width:1100px;
  margin:auto
}

.player-title{
  font-size:13px;
  margin-bottom:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

audio{
  width:100%;
  height:38px
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:65px;
  background:rgba(11,13,18,.98);
  border-top:1px solid var(--line);
  display:flex;
  justify-content:center;
  z-index:30
}

.nav-inner{
  width:min(1100px,100%);
  display:grid;
  grid-template-columns:repeat(4,1fr)
}

.nav-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px
}

.nav-btn.active{color:var(--text)}

.nav-icon{font-size:19px}
.nav-label{font-size:11px}

.modal-wrap{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
  padding:12px
}

.modal{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  background:#11151e;
  border:1px solid var(--line);
  border-radius:23px;
  padding:20px
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px
}

.modal-head h2{
  margin:0;
  font-size:21px
}

.form{
  display:grid;
  gap:11px
}

.form label{
  font-size:13px;
  color:var(--muted)
}

.form input,
.form textarea,
.form select{
  width:100%;
  margin-top:5px;
  background:#0b0e15;
  border:1px solid var(--line);
  border-radius:12px;
  color:var(--text);
  padding:12px;
  outline:none
}

.form textarea{
  min-height:100px;
  resize:vertical
}

.primary{
  width:100%;
  padding:12px;
  border:0;
  border-radius:13px;
  background:var(--accent);
  color:white;
  font-weight:800
}

.secondary{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#1a2030;
  color:var(--text)
}

.link-btn{
  background:none;
  border:0;
  color:#a894ff;
  padding:3px 0
}

.notice{
  font-size:13px;
  line-height:1.45;
  color:var(--muted);
  background:#171c27;
  border-radius:12px;
  padding:11px
}

.account-box{
  display:grid;
  gap:12px
}

.profile-head{
  display:flex;
  align-items:center;
  gap:13px
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#252b3b;
  font-weight:800;
  font-size:20px
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:15px 0;
  border-bottom:1px solid var(--line)
}

.row:last-child{border-bottom:0}

.danger{color:var(--danger)}

.toast{
  position:fixed;
  left:50%;
  bottom:83px;
  transform:translateX(-50%);
  background:#202635;
  border:1px solid var(--line);
  padding:10px 14px;
  border-radius:12px;
  z-index:200;
  font-size:13px;
  max-width:90%
}

.footer{
  max-width:1100px;
  margin:30px auto 90px;
  padding:25px 16px;
  text-align:center;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:13px;
  line-height:1.7
}

.footer strong{color:var(--text)}

@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  .app{
    padding-left:13px;
    padding-right:13px
  }
  .page-title{font-size:23px}
}
</style>
</head>

<body>

<div id="app" class="app">

<header>
  <div class="brand">Audio<span>Hub</span></div>
  <button class="icon-btn" id="accountTopBtn">◯</button>
</header>

<div class="search">
  <input
    id="searchInput"
    type="search"
    placeholder="Search playlists or songs..."
  >
</div>

<div id="homePage">

  <div class="tabs">
    <button class="tab active" data-home-tab="playlists">
      Playlists
    </button>

    <button class="tab" data-home-tab="discover">
      Discover
    </button>
  </div>

  <div id="homeContent"></div>

</div>

<div id="playlistPage" class="hidden"></div>

<div id="downloadsPage" class="hidden"></div>

<div id="accountPage" class="hidden"></div>

</div>

<div id="player" class="player hidden">

  <div class="player-inner">

    <div id="playerTitle" class="player-title"></div>

    <audio
      id="audioPlayer"
      controls
      preload="metadata">
    </audio>

  </div>

</div>

<div class="bottom-nav">

  <div class="nav-inner">

    <button class="nav-btn active" data-page="home">
      <span class="nav-icon">⌂</span>
      <span class="nav-label">Home</span>
    </button>

    <button class="nav-btn" data-page="discover">
      <span class="nav-icon">⌁</span>
      <span class="nav-label">Explore</span>
    </button>

    <button class="nav-btn" data-page="downloads">
      <span class="nav-icon">↓</span>
      <span class="nav-label">Downloads</span>
    </button>

    <button class="nav-btn" data-page="account">
      <span class="nav-icon">◯</span>
      <span class="nav-label">Account</span>
    </button>

  </div>

</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<footer class="footer">

<strong>AudioHub</strong><br>

Listen • Create • Share<br>

<strong>Vɪꜱʜᴜ ʀᴀᴊᴊ</strong><br>

© 2026 AudioHub<br><br>

If I have inadvertently used or uploaded someone else’s song,
the copyright owner can contact me, and I will remove the song upon request.

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* =========================
   SUPABASE
   ========================= */

const SUPABASE_URL =
"https://lnhsuztjmteqrztvcigs.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_E1uXefc5RjykYdAK12PJ_Q_u6mgm8XF";

const hasSupabase =
Boolean(
  window.supabase &&
  SUPABASE_URL &&
  SUPABASE_ANON_KEY
);

const sb =
hasSupabase
? window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  )
: null;


/* =========================
   PLAYLISTS
   ========================= */

const playlists = {

  osho:{
    name:"Osho",
    icon:"◉",
    desc:"Wisdom, awareness & inner growth",
    tracks:[]
  },

  premanand:{
    name:"Premanand Ji",
    icon:"◇",
    desc:"Spiritual talks & devotional wisdom",
    tracks:[]
  },

  study:{
    name:"Study Time",
    icon:"▤",
    desc:"Focus, learning & study sessions",

    tracks:[
      {
        id:"study-parvati",

        title:"Parvati - Sadhu Tiwari",

        subtitle:"Study Time",

        url:
        "https://lnhsuztjmteqrztvcigs.supabase.co/storage/v1/object/public/Audio/Parvati%20%20%20Sadhu%20Tiwari.m4a"
      }
    ]
  },

  motivational:{
    name:"Motivational",
    icon:"↗",
    desc:"Motivation, discipline & personal growth",
    tracks:[]
  }

};


let currentPage="home";
let currentPlaylist=null;
let currentUser=null;
let discoverItems=[];
let searchTerm="";


/* =========================
   HELPERS
   ========================= */

const $ =
id => document.getElementById(id);


function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,ch=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[ch]));

}


function toast(message){

  $("toastRoot").innerHTML =
  `<div class="toast">${esc(message)}</div>`;

  setTimeout(()=>{
    $("toastRoot").innerHTML="";
  },2300);

}


function showOnly(id){

  [
    "homePage",
    "playlistPage",
    "downloadsPage",
    "accountPage"
  ].forEach(x=>{

    $(x).classList.toggle(
      "hidden",
      x!==id
    );

  });

}


function setNav(page){

  document.querySelectorAll(".nav-btn")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.page===page
      );

    });

}


function initials(email){

  return (
    email ||
    "U"
  )
  .trim()
  .slice(0,1)
  .toUpperCase();

}


/* =========================
   FAVORITES
   ========================= */

function favoriteKey(id){

  return "audiohub_fav_"+id;

}


function isFavorite(id){

  return localStorage.getItem(
    favoriteKey(id)
  )==="1";

}


function toggleFavorite(id){

  if(isFavorite(id)){

    localStorage.removeItem(
      favoriteKey(id)
    );

    toast("Removed from Favorites");

  }else{

    localStorage.setItem(
      favoriteKey(id),
      "1"
    );

    toast("Added to Favorites");

  }

}


/* =========================
   INDEXED DB DOWNLOADS
   ========================= */

const DB_NAME="AudioHubOfflineDB";
const STORE="audio";

let dbPromise=null;


function openDB(){

  if(dbPromise) return dbPromise;

  dbPromise =
  new Promise((resolve,reject)=>{

    const req =
    indexedDB.open(
      DB_NAME,
      1
    );

    req.onupgradeneeded=()=>{

      if(
        !req.result.objectStoreNames
        .contains(STORE)
      ){

        req.result
          .createObjectStore(
            STORE,
            {keyPath:"id"}
          );

      }

    };

    req.onsuccess=()=>{
      resolve(req.result);
    };

    req.onerror=()=>{
      reject(req.error);
    };

  });

  return dbPromise;

}


async function getOffline(id){

  const db =
  await openDB();

  return new Promise(
    (resolve,reject)=>{

      const tx =
      db.transaction(
        STORE,
        "readonly"
      );

      const req =
      tx.objectStore(STORE)
        .get(id);

      req.onsuccess=()=>{
        resolve(req.result || null);
      };

      req.onerror=()=>{
        reject(req.error);
      };

    }
  );

}


async function getAllOffline(){

  const db =
  await openDB();

  return new Promise(
    (resolve,reject)=>{

      const tx =
      db.transaction(
        STORE,
        "readonly"
      );

      const req =
      tx.objectStore(STORE)
        .getAll();

      req.onsuccess=()=>{
        resolve(req.result || []);
      };

      req.onerror=()=>{
        reject(req.error);
      };

    }
  );

}


async function saveOffline(item){

  const response =
  await fetch(item.url);

  if(!response.ok){
    throw new Error(
      "Audio download failed"
    );
  }

  const blob =
  await response.blob();

  const db =
  await openDB();

  return new Promise(
    (resolve,reject)=>{

      const tx =
      db.transaction(
        STORE,
        "readwrite"
      );

      tx.objectStore(STORE)
        .put({
          ...item,
          blob
        });

      tx.oncomplete=resolve;

      tx.onerror=()=>{
        reject(tx.error);
      };

    }
  );

}


async function removeOffline(id){

  const db =
  await openDB();

  return new Promise(
    (resolve,reject)=>{

      const tx =
      db.transaction(
        STORE,
        "readwrite"
      );

      tx.objectStore(STORE)
        .delete(id);

      tx.oncomplete=resolve;

      tx.onerror=()=>{
        reject(tx.error);
      };

    }
  );

}


/* =========================
   PLAYER
   ========================= */

async function playTrack(track){

  const player =
  $("audioPlayer");

  const offline =
  await getOffline(track.id)
    .catch(()=>null);

  if(
    offline &&
    offline.blob
  ){

    if(
      player.dataset.objectUrl
    ){

      URL.revokeObjectURL(
        player.dataset.objectUrl
      );

    }

    const objectUrl =
    URL.createObjectURL(
      offline.blob
    );

    player.dataset.objectUrl =
    objectUrl;

    player.src =
    objectUrl;

  }else{

    player.src =
    track.url;

  }

  $("playerTitle")
    .textContent =
    track.title;

  $("player")
    .classList
    .remove("hidden");

  try{

    await player.play();

  }catch{

    /* Browser may require tap */

  }

}


/* =========================
   DOWNLOAD
   ========================= */

async function downloadTrack(track){

  const existing =
  await getOffline(track.id);

  if(existing){

    toast(
      "Already available offline"
    );

    return;

  }

  const ok =
  confirm(
    "Download this audio for offline playback inside AudioHub?"
  );

  if(!ok) return;

  try{

    toast("Downloading...");

    await saveOffline(track);

    toast(
      "Downloaded. Open Downloads to play it offline."
    );

    if(
      currentPage==="downloads"
    ){

      renderDownloads();

    }

  }catch(error){

    console.error(error);

    toast(
      "Download failed. Check your internet connection."
    );

  }

}


/* =========================
   HOME
   ========================= */

function filteredPlaylists(){

  const q =
  searchTerm
    .toLowerCase()
    .trim();

  return Object.entries(playlists)
    .filter(([id,p])=>{

      if(!q) return true;

      return (
        p.name+
        " "+
        p.desc+
        " "+
        p.tracks
          .map(t=>t.title)
          .join(" ")
      )
      .toLowerCase()
      .includes(q);

    });

}


function playlistCard(id,p){

  return `

    <article class="card playlist-card">

      <div>

        <div class="playlist-icon">
          ${esc(p.icon)}
        </div>

        <h3>
          ${esc(p.name)}
        </h3>

        <p>
          ${esc(p.desc)}
        </p>

      </div>

      <button
        class="open-btn"
        data-open-playlist="${esc(id)}">

        Open Playlist

      </button>

    </article>

  `;

}


function renderHome(){

  currentPage="home";

  showOnly("homePage");

  setNav("home");

  const q =
  searchTerm.trim();

  if(q){

    const matches =
    filteredPlaylists();

    $("homeContent").innerHTML=`

      <div class="page-title">
        Search
      </div>

      <p class="page-sub">
        Results for “${esc(q)}”
      </p>

      <div class="grid">

        ${
          matches
            .map(
              ([id,p]) =>
              playlistCard(id,p)
            )
            .join("")
        }

      </div>

      ${
        matches.length
        ? ""
        : `<div class="empty">
             No matching playlists found.
           </div>`
      }

    `;

  }else{

    $("homeContent").innerHTML=`

      <div class="page-title">
        Your Playlists
      </div>

      <p class="page-sub">
        Choose a playlist to start listening.
      </p>

      <div class="grid">

        ${
          Object.entries(playlists)
            .map(
              ([id,p]) =>
              playlistCard(id,p)
            )
            .join("")
        }

      </div>

    `;

  }

  document
    .querySelectorAll(
      "[data-open-playlist]"
    )
    .forEach(btn=>{

      btn.addEventListener(
        "click",
        ()=>{
          openPlaylist(
            btn.dataset.openPlaylist
          );
        }
      );

    });

}


/* =========================
   PLAYLIST PAGE
   ========================= */

function trackHTML(t){

  return `

    <div class="track">

      <div class="cover">
        ♪
      </div>

      <div class="track-info">

        <div class="track-title">
          ${esc(t.title)}
        </div>

        <div class="track-sub">
          ${esc(t.subtitle || "AudioHub")}
        </div>

      </div>

      <div class="track-actions">

        <button
          class="small-btn play-track"
          data-id="${esc(t.id)}"
          title="Play">

          ▶

        </button>

        <button
          class="small-btn fav-track ${isFavorite(t.id) ? "active":""}"
          data-id="${esc(t.id)}"
          title="Favorite">

          ${isFavorite(t.id) ? "♥":"♡"}

        </button>

        <button
          class="small-btn download-track"
          data-id="${esc(t.id)}"
          title="Download">

          ↓

        </button>

      </div>

    </div>

  `;

}


function findTrack(id){

  for(
    const p of Object.values(playlists)
  ){

    const track =
    p.tracks.find(
      x=>x.id===id
    );

    if(track) return track;

  }

  return null;

}


function bindTrackButtons(){

  document
    .querySelectorAll(".play-track")
    .forEach(btn=>{

      btn.addEventListener(
        "click",
        ()=>{

          const track =
          findTrack(
            btn.dataset.id
          );

          if(track)
            playTrack(track);

        }
      );

    });


  document
    .querySelectorAll(".fav-track")
    .forEach(btn=>{

      btn.addEventListener(
        "click",
        ()=>{

          toggleFavorite(
            btn.dataset.id
          );

          const active =
          isFavorite(
            btn.dataset.id
          );

          btn.classList.toggle(
            "active",
            active
          );

          btn.textContent =
