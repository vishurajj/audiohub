<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>AudioHub</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Inter,Arial,sans-serif;
background:#070914;
color:#fff;
min-height:100vh;
padding-bottom:86px
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{max-width:920px;margin:auto}

.header{
padding:28px 20px;
background:linear-gradient(135deg,#17142f,#11152b);
border-bottom:1px solid #252a43
}
.logo{
font-size:39px;
font-weight:800;
background:linear-gradient(90deg,#8e6bff,#5d96ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}
.creator{color:#858ca7;margin-top:6px}

main{padding:20px 18px 125px}
.section-title{font-size:28px;margin:20px 0 17px}

.search{
width:100%;
padding:14px 17px;
border:1px solid #282e49;
border-radius:15px;
background:#111527;
color:#fff;
outline:0;
margin-bottom:20px
}
.search:focus{border-color:#735dff}

.tabs{display:flex;gap:12px;margin-bottom:25px}
.tab{
padding:12px 23px;
border-radius:30px;
border:1px solid #292e4b;
background:#111527;
color:#8991ad
}
.tab.active{
background:#2a2055;
border-color:#765cff;
color:#fff
}

.card{
background:#111527;
border:1px solid #252b45;
border-radius:18px;
padding:17px;
margin-bottom:12px
}

.playlist{
display:flex;
align-items:center;
gap:15px;
cursor:pointer;
transition:.2s
}
.playlist:hover{border-color:#6958db}
.play-icon{
width:52px;
height:52px;
border-radius:15px;
display:grid;
place-items:center;
background:#241d48;
color:#9b86ff;
font-size:25px;
flex:none
}
.info{flex:1}
.name{font-size:18px;font-weight:700}
.desc{font-size:13px;color:#7f87a3;margin-top:5px}
.arrow{font-size:28px;color:#747c99}

.btn{
border:1px solid #2d3453;
background:#151a2c;
color:#fff;
padding:10px 14px;
border-radius:11px
}
.btn.primary{
background:#735cff;
border-color:#735cff
}
.btn.danger{
background:#321923;
border-color:#693244;
color:#ff9eb1
}
.btn.wide{width:100%}

.track{
display:flex;
align-items:center;
gap:13px
}
.track-info{flex:1}
.track-title{font-weight:700}
.track-sub{font-size:12px;color:#7d86a4;margin-top:4px}

.actions{
display:flex;
gap:7px;
margin-top:12px;
flex-wrap:wrap
}
.icon-btn{
width:39px;
height:39px;
border-radius:11px;
border:1px solid #2b3150;
background:#151a2c;
color:#aab1c8
}
.icon-btn.active{
color:#ff7d9c;
border-color:#7b3c52
}

.hero{
padding:25px;
border:1px solid #282e49;
border-radius:20px;
background:linear-gradient(135deg,#15142e,#101528);
margin-bottom:20px
}
.hero-icon{
font-size:42px;
color:#907cff;
margin-bottom:10px
}
.hero h1{font-size:29px}
.hero p{color:#8089a5;margin-top:6px}

.empty{
text-align:center;
padding:55px 20px;
color:#7d86a4
}

.post{
background:#111527;
border:1px solid #252b45;
border-radius:18px;
padding:17px;
margin-bottom:13px
}
.post-title{font-size:18px;font-weight:700}
.post-meta{font-size:12px;color:#737c99;margin-top:5px}
.post-desc{font-size:14px;color:#a4abc0;margin-top:10px;line-height:1.5}

.audio-wrap{
position:fixed;
left:0;
right:0;
bottom:72px;
z-index:50;
display:none;
padding:10px;
background:#101426;
border-top:1px solid #292f49
}
.audio-wrap.show{display:block}
.audio-inner{
max-width:920px;
margin:auto;
display:flex;
gap:10px;
align-items:center
}
.audio-title{
font-size:12px;
color:#a8afc6;
width:120px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}
audio{flex:1;height:40px}

.nav{
position:fixed;
left:0;
right:0;
bottom:0;
height:72px;
z-index:60;
background:#0d1020;
border-top:1px solid #252a43;
display:flex;
justify-content:center
}
.nav button{
width:25%;
max-width:180px;
border:0;
background:none;
color:#68718f;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px
}
.nav button.active{color:#8c78ff}
.nav-icon{font-size:26px;line-height:1}
.nav-label{font-size:12px}

.modal{
position:fixed;
inset:0;
z-index:100;
background:rgba(0,0,0,.72);
display:flex;
align-items:center;
justify-content:center;
padding:18px
}
.modal-box{
width:min(560px,100%);
max-height:90vh;
overflow:auto;
background:#111527;
border:1px solid #2a3150;
border-radius:20px;
padding:20px
}
.modal-box h2{margin-bottom:18px}

.input,.textarea,.select{
width:100%;
padding:13px;
border-radius:11px;
border:1px solid #2b3150;
background:#0b0f1d;
color:#fff;
outline:none;
margin-bottom:11px
}
.textarea{min-height:100px;resize:vertical}
.input:focus,.textarea:focus,.select:focus{border-color:#735cff}

.form-label{
font-size:12px;
color:#8a93ad;
margin:4px 0 6px;
display:block
}

.row{
display:flex;
gap:9px
}
.row>*{flex:1}

.muted{color:#78819d}
.small{font-size:12px}

.comment{
padding:11px 0;
border-bottom:1px solid #242a43
}
.comment strong{font-size:13px}
.comment p{
font-size:13px;
color:#a4abc0;
margin-top:4px
}

.site-footer{
text-align:center;
padding:30px 18px 22px;
margin-top:28px;
border-top:1px solid #252b45;
color:#7e86a1
}
.footer-brand{
font-size:18px;
font-weight:700;
color:#c7cce0
}
.footer-tagline{
font-size:13px;
margin-top:6px
}
.footer-name{
font-size:16px;
font-weight:700;
color:#8f7bff;
margin-top:14px;
letter-spacing:.5px
}
.footer-copy{
font-size:12px;
margin-top:7px
}
.footer-notice{
max-width:760px;
margin:16px auto 0;
font-size:11px;
line-height:1.6;
color:#737b98
}

@media(max-width:600px){
.logo{font-size:37px}
main{padding-left:14px;padding-right:14px}
.audio-title{display:none}
}
</style>
</head>

<body>

<div class="app">

<header class="header">
<div class="logo">AudioHub</div>
<div class="creator">Listen • Create • Share</div>
</header>

<main>

<!-- HOME -->
<section id="home">

<input
id="homeSearch"
class="search"
placeholder="Search playlists, audio or creators..."
oninput="renderHome()"
>

<div class="tabs">
<button class="tab active" onclick="setHomeTab(this,'playlists')">
Playlists
</button>

<button class="tab" onclick="setHomeTab(this,'discover')">
Discover
</button>
</div>

<h2 id="homeTitle" class="section-title">Your Playlists</h2>

<div id="homeContent"></div>

</section>


<!-- EXPLORE -->
<section id="explore" class="hidden">

<h2 class="section-title">Discover</h2>

<div id="discoverContent"></div>

</section>


<!-- PLAYLIST -->
<section id="playlistPage" class="hidden">

<button class="btn" onclick="showHome()">← Back</button>

<div class="hero" style="margin-top:15px">
<div id="plIcon" class="hero-icon">◉</div>
<h1 id="plName">Playlist</h1>
<p id="plDesc"></p>
</div>

<div id="trackList"></div>

</section>


<!-- DOWNLOADS -->
<section id="downloads" class="hidden">

<h2 class="section-title">Downloads</h2>

<div id="downloadsContent"></div>

</section>


<!-- ACCOUNT -->
<section id="account" class="hidden">

<h2 class="section-title">Account</h2>

<div id="accountContent"></div>

</section>


<!-- PROFILE -->
<section id="profilePage" class="hidden">

<button class="btn" onclick="showExplore()">← Back</button>

<div id="profileContent" style="margin-top:15px"></div>

</section>

</main>


<!-- AUDIO PLAYER -->
<div id="audioWrap" class="audio-wrap">

<div class="audio-inner">

<div id="audioTitle" class="audio-title">
Select audio
</div>

<audio id="audioPlayer" controls></audio>

</div>

</div>


<!-- BOTTOM NAV -->
<nav class="nav">

<button class="active" onclick="showHome()">
<span class="nav-icon">⌂</span>
<span class="nav-label">Home</span>
</button>

<button onclick="showExplore()">
<span class="nav-icon">⌁</span>
<span class="nav-label">Explore</span>
</button>

<button onclick="showDownloads()">
<span class="nav-icon">↓</span>
<span class="nav-label">Downloads</span>
</button>

<button onclick="showAccount()">
<span class="nav-icon">◯</span>
<span class="nav-label">Account</span>
</button>

</nav>

</div>


<!-- AUTH MODAL -->
<div id="authModal" class="modal hidden">

<div class="modal-box">

<h2 id="authTitle">Create account</h2>

<input
id="authEmail"
class="input"
type="email"
placeholder="Email address"
>

<input
id="authPassword"
class="input"
type="password"
placeholder="Password"
>

<button class="btn primary wide" onclick="submitAuth()">
Continue
</button>

<div style="height:10px"></div>

<button class="btn wide" onclick="switchAuth()">
Switch Login / Signup
</button>

<button class="btn wide" style="margin-top:8px" onclick="closeModal('authModal')">
Close
</button>

<p id="authStatus" class="small muted" style="margin-top:12px"></p>

</div>

</div>


<!-- UPLOAD MODAL -->
<div id="uploadModal" class="modal hidden">

<div class="modal-box">

<h2>Upload Audio</h2>

<label class="form-label">Audio file</label>
<input id="uploadFile" class="input" type="file" accept="audio/*">

<label class="form-label">Cover image</label>
<input id="coverFile" class="input" type="file" accept="image/*">

<label class="form-label">Title</label>
<input id="uploadTitle" class="input" placeholder="Audio title">

<label class="form-label">Description</label>
<textarea id="uploadDesc" class="textarea" placeholder="Describe this audio"></textarea>

<label class="form-label">Category</label>

<select id="uploadCategory" class="select">

<option value="study">Study</option>
<option value="motivation">Motivational</option>
<option value="spiritual">Spiritual</option>
<option value="talks">Talks</option>
<option value="other">Other</option>

</select>

<label class="form-label">Visibility</label>

<select id="uploadVisibility" class="select">
<option value="public">Public</option>
</select>

<label style="display:flex;gap:8px;align-items:flex-start;margin:12px 0">

<input id="rights" type="checkbox">

<span class="small">
I confirm that I have the right/permission to upload this audio.
</span>

</label>

<button class="btn primary wide" onclick="uploadAudio()">
Upload
</button>

<button
class="btn wide"
style="margin-top:8px"
onclick="closeModal('uploadModal')"
>
Cancel
</button>

<p id="uploadStatus" class="small muted" style="margin-top:12px"></p>

</div>

</div>


<!-- COMMENTS -->
<div id="commentsModal" class="modal hidden">

<div class="modal-box">

<h2>Comments</h2>

<div id="commentsList"></div>

<div style="display:flex;gap:8px;margin-top:13px">

<input
id="commentInput"
class="input"
style="margin:0"
placeholder="Write a comment..."
>

<button class="btn primary" onclick="addComment()">
Post
</button>

</div>

<button
class="btn wide"
style="margin-top:10px"
onclick="closeModal('commentsModal')"
>
Close
</button>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://lnhsuztjmteqrztvcigs.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_E1uXefc5RjykYdAK12PJ_Q_u6mgm8XF";

const sbReady =
!SUPABASE_ANON_KEY.includes("PASTE_YOUR");

const sb =
sbReady
? window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
)
: null;


/* =========================
PLAYLISTS
========================= */

const playlists = {

osho:{
name:"Osho",
icon:"◉",
desc:"Wisdom, awareness & inner growth",
tracks:[]
},

premanand:{
name:"Premanand Ji",
icon:"◇",
desc:"Spiritual talks & devotional wisdom",
tracks:[]
},

study:{
name:"Study Time",
icon:"▤",
desc:"Focus, learning & study sessions",
tracks:[
{
title:"Parvati - Sadhu Tiwari",
subtitle:"Study Time",
url:"https://lnhsuztjmteqrztvcigs.supabase.co/storage/v1/object/public/Audio/Parvati%20%20%20Sadhu%20Tiwari.m4a"
}
]
},

motivational:{
name:"Motivational",
icon:"↗",
desc:"Motivation, discipline & personal growth",
tracks:[]
}

};


Object.values(playlists).forEach(p=>{

p.tracks.forEach(t=>{

t.id=encodeURIComponent(t.url);

});

});


let homeTab="playlists";
let currentTracks=[];
let currentPlaylist=null;
let currentAudioId=null;
let currentCommunityAudio=null;
let authMode="signup";

let favorites=
JSON.parse(
localStorage.getItem("audiohubFavorites")||"[]"
);

let downloads=
JSON.parse(
localStorage.getItem("audiohubDownloads")||"[]"
);


/* =========================
OFFLINE DATABASE
========================= */

const DB="AudioHubOfflineDB";
const STORE="audio";

let dbp;

function db(){

if(dbp)return dbp;

dbp=new Promise((res,rej)=>{

let r=indexedDB.open(DB,1);

r.onupgradeneeded=()=>{
r.result.createObjectStore(
STORE,
{keyPath:"id"}
);
};

r.onsuccess=()=>res(r.result);

r.onerror=()=>rej(r.error);

});

return dbp;
}


async function saveLocal(t){

let r=await fetch(t.url);

if(!r.ok)throw 0;

let blob=await r.blob();

let d=await db();

return new Promise((res,rej)=>{

let x=d.transaction(
STORE,
"readwrite"
);

x.objectStore(STORE).put({

id:t.id,
title:t.title,
subtitle:t.subtitle||"AudioHub",
blob

});

x.oncomplete=res;
x.onerror=()=>rej(x.error);

});

}


async function localAudio(id){

let d=await db();

return new Promise((res,rej)=>{

let r=d.transaction(STORE)
.objectStore(STORE)
.get(id);

r.onsuccess=()=>{
res(r.result||null);
};

r.onerror=()=>rej(r.error);

});

}


async function removeLocal(id){

let d=await db();

return new Promise((res,rej)=>{

let x=d.transaction(
STORE,
"readwrite"
);

x.objectStore(STORE).delete(id);

x.oncomplete=res;
x.onerror=()=>rej(x.error);

});

}


/* =========================
PAGE NAVIGATION
========================= */

function hide(){

[
"home",
"explore",
"playlistPage",
"downloads",
"account",
"profilePage"
]
.forEach(x=>
document
.getElementById(x)
.classList.add("hidden")
);

}


function nav(i){

document
.querySelectorAll(".nav button")
.forEach((b,n)=>
b.classList.toggle(
"active",
n===i
)
);

}


function showHome(){

hide();

document
.getElementById("home")
.classList.remove("hidden");

nav(0);

renderHome();

scrollTo(0,0);

}


function showExplore(){

hide();

document
.getElementById("explore")
.classList.remove("hidden");

nav(1);

renderDiscover();

scrollTo(0,0);

}


function showDownloads(){

hide();

document
.getElementById("downloads")
.classList.remove("hidden");

nav(2);

renderDownloads();

}


async function showAccount(){

hide();

document
.getElementById("account")
.classList.remove("hidden");

nav(3);

renderAccount();

}


function setHomeTab(btn,tab){

homeTab=tab;

document
.querySelectorAll("#home .tab")
.forEach(x=>
x.classList.remove("active")
);

btn.classList.add("active");

renderHome();

}


/* =========================
HOME
========================= */

function renderHome(){

const q=
(
document
.getElementById("homeSearch")
.value||""
).toLowerCase();

const c=
document.getElementById("homeContent");

document.getElementById("homeTitle")
.textContent=
homeTab==="playlists"
?"Your Playlists"
:"Discover";

if(homeTab==="discover"){

renderDiscoverInto(c,q);

return;

}

c.innerHTML="";

Object.entries(playlists).forEach(
([id,p])=>{

if(
q &&
!(`${p.name} ${p.desc}`)
.toLowerCase()
.includes(q)
)return;

let e=
document.createElement("div");

e.className="card playlist";

e.onclick=()=>{
openPlaylist(id);
};

e.innerHTML=`

<div class="play-icon">
${p.icon}
</div>

<div class="info">

<div class="name">
${esc(p.name)}
</div>

<div class="desc">
${esc(p.desc)}
</div>

</div>

<div class="arrow">
›
</div>

`;

c.appendChild(e);

});

}


/* =========================
PLAYLIST
========================= */

function openPlaylist(id){

let p=playlists[id];

if(!p)return;

currentPlaylist=id;

currentTracks=p.tracks;

hide();

document
.getElementById("playlistPage")
.classList.remove("hidden");

nav(0);

document
.getElementById("plIcon")
.textContent=p.icon;

document
.getElementById("plName")
.textContent=p.name;

document
.getElementById("plDesc")
.textContent=p.desc;

renderTracks();

scrollTo(0,0);

}


function renderTracks(){

let c=
document.getElementById("trackList");

if(!currentTracks.length){

c.innerHTML=`
<div class="empty">
<b>No audio added yet</b>
<div style="margin-top:7px">
More audio will appear here soon.
</div>
</div>
`;

return;

}

c.innerHTML="";

currentTracks.forEach(t=>{

let d=
document.createElement("div");

d.className="card";

d.innerHTML=`

<div class="track">

<div class="info">

<div class="track-title">
${esc(t.title)}
</div>

<div class="track-sub">
${esc(t.subtitle||"AudioHub")}
</div>

</div>

</div>

<div class="actions">

<button class="btn primary"
onclick="playSourceByObject(${JSON.stringify(t).replace(/"/g,'&quot;')})">
▶ Play
</button>

<button class="icon-btn ${favorites.includes(t.id)?"active":""}"
onclick="toggleFavorite('${t.id}')">
${favorites.includes(t.id)?"♥":"♡"}
</button>

<button class="icon-btn"
onclick="downloadTrack('${t.id}')">
↓
</button>

</div>

`;

c.appendChild(d);

});

}


/* =========================
PLAYER
========================= */

function playSourceByObject(t){

playSource(t);

}


async function playSource(t){

currentAudioId=t.id;

let local=
await localAudio(t.id)
.catch(()=>null);

let url;

if(local){

url=URL.createObjectURL(local.blob);

}else{

url=t.url;

}

let player=
document.getElementById("audioPlayer");

player.src=url;

document.getElementById("audioTitle")
.textContent=t.title;

document
.getElementById("audioWrap")
.classList.add("show");

player.play()
.catch(()=>{});

}


/* =========================
FAVORITES
========================= */

function toggleFavorite(id){

if(favorites.includes(id)){

favorites=
favorites.filter(x=>x!==id);

}else{

favorites.push(id);

}

localStorage.setItem(
"audiohubFavorites",
JSON.stringify(favorites)
);

if(currentPlaylist)
renderTracks();

}


function isDownloaded(id){

return downloads.includes(id);

}


/* =========================
DOWNLOAD
========================= */

async function downloadTrack(id){

let t;

for(let p of Object.values(playlists)){

let found=
p.tracks.find(x=>x.id===id);

if(found){

t=found;

break;

}

}

if(!t)return;

if(isDownloaded(id)){

alert("Already downloaded.");

return;

}

if(!confirm(
"Download this audio for offline playback inside AudioHub?"
))return;

try{

await saveLocal(t);

downloads.push(id);

localStorage.setItem(
"audiohubDownloads",
JSON.stringify(downloads)
);

alert(
"Downloaded successfully. You can play it offline from AudioHub Downloads."
);

}catch(e){

alert(
"Download failed. Please check your internet connection."
);

}

}


async function renderDownloads(){

let c=
document.getElementById("downloadsContent");

c.innerHTML="";

let found=[];

for(let p of Object.values(playlists)){

for(let t of p.tracks){

if(downloads.includes(t.id)){

found.push(t);

}

}

}

if(!found.length){

c.innerHTML=`
<div class="empty">
<b>No downloads yet</b>
<div style="margin-top:7px">
Downloaded audio will appear here.
</div>
</div>
`;

return;

}

found.forEach(t=>{

let d=
document.createElement("div");

d.className="card";

d.innerHTML=`

<div class="track">

<div class="info">

<div class="track-title">
${esc(t.title)}
</div>

<div class="track-sub">
Available offline
</div>

</div>

</div>

<div class="actions">

<button class="btn primary"
onclick="playSourceByObject(${JSON.stringify(t).replace(/"/g,'&quot;')})">
▶ Play
</button>

<button class="btn danger"
onclick="deleteDownload('${t.id}')">
Remove
</button>

</div>

`;

c.appendChild(d);

});

}


async function deleteDownload(id){

if(!confirm("Remove this download?"))
return;

await removeLocal(id);

downloads=
downloads.filter(x=>x!==id);

localStorage.setItem(
"audiohubDownloads",
JSON.stringify(downloads)
);

renderDownloads();

}


/* =========================
AUTH
========================= */

function openAuth(mode){

authMode=mode;

document.getElementById("authTitle")
.textContent=
mode==="login"
?"Login"
:"Create account";

document.getElementById("authStatus")
.textContent="";
