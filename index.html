<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>AudioHub</title>
<style>
:root{--bg:#0b0d12;--card:#151a24;--card2:#1b2130;--text:#f5f7fb;--muted:#9ba4b4;--line:#293141;--accent:#7c5cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:900px;margin:auto;padding:18px 14px 105px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{font-size:24px;font-weight:800}.logo b{color:#9b87ff}
.icon{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:white}
.search{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:white;outline:none;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{padding:9px 14px;border-radius:30px;border:1px solid var(--line);background:transparent;color:var(--muted)}.tab.active{background:white;color:#111}
h1{font-size:25px;margin:8px 0}.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.card{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:19px;padding:17px}
.playlist{min-height:170px;display:flex;flex-direction:column;justify-content:space-between}
.playicon{font-size:30px;margin-bottom:12px}.card h2{font-size:18px;margin:0 0 6px}.card p{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
.open{width:100%;margin-top:16px;padding:11px;border:0;border-radius:12px;background:#293142;color:white;font-weight:700}
.track{display:flex;align-items:center;gap:11px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:15px;margin-bottom:10px}
.cover{width:52px;height:52px;flex:none;border-radius:12px;background:#252c3b;display:grid;place-items:center;font-size:20px}
.info{flex:1;min-width:0}.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:3px}
.actions{display:flex;gap:5px}.small{width:37px;height:37px;border:1px solid var(--line);border-radius:10px;background:#202737;color:white}
.small.fav{color:#ff6d83}.empty{padding:35px 15px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
.back{border:0;background:none;color:var(--muted);padding:4px 0 15px}
.player{position:fixed;bottom:64px;left:0;right:0;z-index:20;background:#10141d;border-top:1px solid var(--line);padding:9px 14px}
.playerin{max-width:900px;margin:auto}.now{font-size:12px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}audio{width:100%;height:38px}
.nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#0b0d12;border-top:1px solid var(--line);z-index:30}
.navin{max-width:900px;margin:auto;height:100%;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:none;color:var(--muted);font-size:11px}.nav button.active{color:white}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
.modalbg{position:fixed;inset:0;background:#000b;z-index:100;display:flex;align-items:flex-end;padding:10px}.modal{width:min(520px,100%);max-height:92vh;overflow:auto;margin:auto;background:#111620;border:1px solid var(--line);border-radius:22px;padding:19px}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.form{display:grid;gap:12px}.form label{font-size:13px;color:var(--muted)}
.form input,.form textarea,.form select{width:100%;margin-top:5px;padding:12px;border-radius:11px;border:1px solid var(--line);background:#0b0e14;color:white;outline:none}.form textarea{min-height:90px}
.primary,.secondary{width:100%;padding:12px;border-radius:12px;font-weight:700}.primary{border:0;background:var(--accent);color:white}.secondary{border:1px solid var(--line);background:#202737;color:white}
.link{border:0;background:none;color:#a995ff;padding:4px}.notice{background:#191f2b;color:var(--muted);padding:11px;border-radius:11px;font-size:12px;line-height:1.5}
.profile{display:flex;align-items:center;gap:12px}.avatar{width:56px;height:56px;border-radius:50%;background:#293142;display:grid;place-items:center;font-weight:800;font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.footer{text-align:center;color:var(--muted);font-size:12px;line-height:1.7;border-top:1px solid var(--line);padding:24px 12px 30px;margin-top:30px}.footer b{color:white}
.hidden{display:none!important}.toast{position:fixed;z-index:200;left:50%;bottom:82px;transform:translateX(-50%);background:#252d3d;color:white;padding:10px 14px;border-radius:11px;font-size:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.app{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">Audio<b>Hub</b></div><button class="icon" id="topAccount">◯</button></header>
<input class="search" id="search" placeholder="Search playlists or songs...">
<section id="home">
<div class="tabs"><button class="tab active" id="playlistTab">Playlists</button><button class="tab" id="discoverTab">Discover</button></div>
<div id="homeContent"></div>
</section>
<section id="playlistPage" class="hidden"></section>
<section id="downloadsPage" class="hidden"></section>
<section id="accountPage" class="hidden"></section>
<footer class="footer"><b>AudioHub</b><br>Listen • Create • Share<br><b>Vɪꜱʜᴜ ʀᴀᴊᴊ</b><br>© 2026 AudioHub<br><br>If I have inadvertently used or uploaded someone else’s song, the copyright owner can contact me, and I will remove the song upon request.</footer>
</div>
<div id="player" class="player hidden"><div class="playerin"><div class="now" id="now"></div><audio id="audio" controls></audio></div></div>
<nav class="nav"><div class="navin">
<button data-nav="home" class="active"><i>⌂</i>Home</button>
<button data-nav="discover"><i>⌁</i>Explore</button>
<button data-nav="downloads"><i>↓</i>Downloads</button>
<button data-nav="account"><i>◯</i>Account</button>
</div></nav>
<div id="modal"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const SUPABASE_URL="https://lnhsuztjmteqrztvcigs.supabase.co";
const SUPABASE_KEY="sb_publishable_E1uXefc5RjykYdAK12PJ_Q_u6mgm8XF";
const supa=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const playlists={
osho:{name:"Osho",icon:"◉",desc:"Wisdom, awareness & inner growth",tracks:[]},
premanand:{name:"Premanand Ji",icon:"◇",desc:"Spiritual talks & devotional wisdom",tracks:[]},
study:{name:"Study Time",icon:"▤",desc:"Focus, learning & study sessions",tracks:[{id:"study-parvati",title:"Parvati - Sadhu Tiwari",sub:"Study Time",url:"https://lnhsuztjmteqrztvcigs.supabase.co/storage/v1/object/public/Audio/Parvati%20%20%20Sadhu%20Tiwari.m4a"}]},
motivational:{name:"Motivational",icon:"↗",desc:"Motivation, discipline & personal growth",tracks:[]}
};
let page="home",selectedPlaylist=null,user=null,community=[],query="";
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){$("toast").innerHTML=`<div class="toast">${esc(m)}</div>`;setTimeout(()=>$("toast").innerHTML="",2200)}
function hideAll(){$("home").classList.add("hidden");$("playlistPage").classList.add("hidden");$("downloadsPage").classList.add("hidden");$("accountPage").classList.add("hidden")}
function navActive(n){document.querySelectorAll("[data-nav]").forEach(b=>b.classList.toggle("active",b.dataset.nav===n))}
function fav(id){return localStorage.getItem("ahfav_"+id)==="1"}
function toggleFav(id){fav(id)?localStorage.removeItem("ahfav_"+id):localStorage.setItem("ahfav_"+id,"1");toast(fav(id)?"Added to Favorites":"Removed from Favorites")}
let db=null;
function database(){if(db)return Promise.resolve(db);return new Promise((resolve,reject)=>{const r=indexedDB.open("AudioHubOffline",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("audio"))r.result.createObjectStore("audio",{keyPath:"id"})};r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error)})}
async function offline(id){const d=await database();return new Promise((resolve,reject)=>{const r=d.transaction("audio","readonly").objectStore("audio").get(id);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
async function allOffline(){const d=await database();return new Promise((resolve,reject)=>{const r=d.transaction("audio","readonly").objectStore("audio").getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
async function saveOffline(t){const res=await fetch(t.url);if(!res.ok)throw Error("Download failed");const blob=await res.blob();const d=await database();return new Promise((resolve,reject)=>{const tx=d.transaction("audio","readwrite");tx.objectStore("audio").put({id:t.id,title:t.title,sub:t.sub||"AudioHub",url:t.url,blob});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function deleteOffline(id){const d=await database();return new Promise((resolve,reject)=>{const tx=d.transaction("audio","readwrite");tx.objectStore("audio").delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function play(t){const p=$("audio"),saved=await offline(t.id).catch(()=>null);if(saved){if(p.dataset.object)URL.revokeObjectURL(p.dataset.object);const u=URL.createObjectURL(saved.blob);p.dataset.object=u;p.src=u}else p.src=t.url;$("now").textContent=t.title;$("player").classList.remove("hidden");try{await p.play()}catch(e){}}
async function download(t){if(await offline(t.id)){toast("Already downloaded");return}if(!confirm("Download this audio for offline playback inside AudioHub?"))return;try{toast("Downloading...");await saveOffline(t);toast("Saved to AudioHub Downloads")}catch(e){toast("Download failed")}}
function playlistCard(id,p){return`<div class="card playlist"><div><div class="playicon">${esc(p.icon)}</div><h2>${esc(p.name)}</h2><p>${esc(p.desc)}</p></div><button class="open" data-playlist="${esc(id)}">Open Playlist</button></div>`}
function renderHome(){page="home";hideAll();$("home").classList.remove("hidden");navActive("home");const q=query.toLowerCase().trim();const list=Object.entries(playlists).filter(([id,p])=>!q||(p.name+" "+p.desc+" "+p.tracks.map(t=>t.title).join(" ")).toLowerCase().includes(q));$("homeContent").innerHTML=`<h1>${q?"Search":"Your Playlists"}</h1><p class="sub">${q?`Results for “${esc(query)}”`:"Choose a playlist to start listening."}</p><div class="grid">${list.map(([id,p])=>playlistCard(id,p)).join("")}</div>${list.length?"":`<div class="empty">No matching playlists found.</div>`}`;document.querySelectorAll("[data-playlist]").forEach(b=>b.onclick=()=>openPlaylist(b.dataset.playlist))}
function findTrack(id){for(const p of Object.values(playlists)){const t=p.tracks.find(x=>x.id===id);if(t)return t}return null}
function trackHTML(t){return`<div class="track"><div class="cover">♪</div><div class="info"><div class="title">${esc(t.title)}</div><div class="meta">${esc(t.sub||"AudioHub")}</div></div><div class="actions"><button class="small play" data-id="${esc(t.id)}">▶</button><button class="small fav" data-fav="${esc(t.id)}">${fav(t.id)?"♥":"♡"}</button><button class="small" data-download="${esc(t.id)}">↓</button></div></div>`}
function bindTracks(){document.querySelectorAll(".play").forEach(b=>b.onclick=()=>{const t=findTrack(b.dataset.id);if(t)play(t)});document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{toggleFav(b.dataset.fav);b.textContent=fav(b.dataset.fav)?"♥":"♡"});document.querySelectorAll("[data-download]").forEach(b=>b.onclick=()=>{const t=findTrack(b.dataset.download);if(t)download(t)})}
function openPlaylist(id){const p=playlists[id];if(!p)return;selectedPlaylist=id;page="playlist";hideAll();$("playlistPage").classList.remove("hidden");const q=query.toLowerCase().trim(),tracks=p.tracks.filter(t=>!q||(t.title+" "+(t.sub||"")).toLowerCase().includes(q));$("playlistPage").innerHTML=`<button class="back" id="back">← Back</button><h1>${esc(p.icon)} ${esc(p.name)}</h1><p class="sub">${esc(p.desc)}</p>${tracks.length?tracks.map(trackHTML).join(""):`<div class="empty">No audio has been added to this playlist yet.</div>`}`;$("back").onclick=renderHome;bindTracks()}
async function renderDownloads(){page="downloads";hideAll();$("downloadsPage").classList.remove("hidden");navActive("downloads");const items=await allOffline();$("downloadsPage").innerHTML=`<h1>Downloads</h1><p class="sub">Your offline AudioHub audio.</p>${items.length?items.map(x=>`<div class="track"><div class="cover">↓</div><div class="info"><div class="title">${esc(x.title)}</div><div class="meta">Available offline</div></div><div class="actions"><button class="small" data-offplay="${esc(x.id)}">▶</button><button class="small" data-offdelete="${esc(x.id)}">×</button></div></div>`).join(""):`<div class="empty">No downloads yet.<br><br>Use ↓ on a track to save it offline.</div>`}`;document.querySelectorAll("[data-offplay]").forEach(b=>b.onclick=()=>{const x=items.find(a=>a.id===b.dataset.offplay);if(x)play(x)});document.querySelectorAll("[data-offdelete]").forEach(b=>b.onclick=async()=>{await deleteOffline(b.dataset.offdelete);renderDownloads()})}
async function getUser(){if(!supa){user=null;return}const{data}=await supa.auth.getUser();user=data?.user||null}
function closeModal(){$("modal").innerHTML=""}
function authModal(mode){$("modal").innerHTML=`<div class="modalbg"><div class="modal"><div class="modalhead"><h2>${mode==="login"?"Login":"Create Account"}</h2><button class="icon" id="close">×</button></div><form class="form" id="authForm"><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" required minlength="6" placeholder="Minimum 6 characters"></label><button class="primary">${mode==="login"?"Login":"Create Account"}</button>${mode==="login"?`<button class="link" type="button" id="forgot">Forgot password?</button>`:""}<button class="link" type="button" id="switch">${mode==="login"?"Create a new account":"Already have an account? Login"}</button></form></div></div>`;$("close").onclick=closeModal;$("switch").onclick=()=>authModal(mode==="login"?"signup":"login");if($("forgot"))$("forgot").onclick=forgotPassword;$("authForm").onsubmit=async e=>{e.preventDefault();if(!supa){toast("Supabase is unavailable");return}try{const email=$("email").value.trim(),password=$("password").value;if(mode==="login"){const{error}=await supa.auth.signInWithPassword({email,password});if(error)throw error;await getUser();closeModal();renderAccount();toast("Login successful")}else{const{error}=await supa.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;toast("Account created. Check your email for confirmation.");authModal("login")}}catch(e){toast(e.message||"Authentication failed")}}}
async function forgotPassword(){if(!supa)return;const email=prompt("Enter your AudioHub email:");if(!email)return;try{const{error}=await supa.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.origin+location.pathname});if(error)throw error;toast("Password reset email sent")}catch(e){toast(e.message||"Reset failed")}}
async function logout(){if(supa)await supa.auth.signOut();user=null;renderAccount();toast("Logged out")}
async function renderAccount(){await getUser();page="account";hideAll();$("accountPage").classList.remove("hidden");navActive("account");if(!user){$("accountPage").innerHTML=`<h1>Account</h1><p class="sub">Login or create an AudioHub account.</p><div class="card"><div class="notice">Your account lets you use community features and upload your own permitted audio.</div><br><button class="primary" id="login">Login</button><br><br><button class="secondary" id="signup">Create Account</button></div>`;$("login").onclick=()=>authModal("login");$("signup").onclick=()=>authModal("signup");return}$("accountPage").innerHTML=`<h1>Account</h1><div class="card"><div class="profile"><div class="avatar">${esc((user.email||"U")[0].toUpperCase())}</div><div><b>${esc(user.email)}</b><div class="meta">AudioHub account</div></div></div><br><div class="row"><span>Favorites</span><button class="secondary" style="width:auto" id="favorites">View</button></div><div class="row"><span>Upload audio</span><button class="secondary" style="width:auto" id="upload">Upload</button></div><div class="row"><span>Logout</span><button class="secondary" style="width:auto;color:#ff6d83" id="logout">Logout</button></div></div>`;$("favorites").onclick=renderFavorites;$("upload").onclick=openUpload;$("logout").onclick=logout}
function renderFavorites(){hideAll();$("accountPage").classList.remove("hidden");const list=[];Object.values(playlists).forEach(p=>p.tracks.forEach(t=>{if(fav(t.id))list.push(t)}));$("accountPage").innerHTML=`<button class="back" id="backAccount">← Account</button><h1>Favorites</h1><p class="sub">Your favorite tracks on this device.</p>${list.length?list.map(trackHTML).join(""):`<div class="empty">No favorites yet.</div>`}`;$("backAccount").onclick=renderAccount;bindTracks()}
function openUpload(){if(!user){authModal("login");return}$("modal").innerHTML=`<div class="modalbg"><div class="modal"><div class="modalhead"><h2>Upload Audio</h2><button class="icon" id="closeUpload">×</button></div><form class="form" id="uploadForm"><label>Audio file<input id="audioFile" type="file" accept="audio/*" required></label><label>Cover image<input id="coverFile" type="file" accept="image/*"></label><label>Title<input id="audioTitle" maxlength="120" required placeholder="Audio title"></label><label>Description<textarea id="audioDesc" maxlength="500" placeholder="Description"></textarea></label><label>Category<select id="audioCategory"><option>Motivational</option><option>Spiritual</option><option>Study</option><option>Music</option><option>Other</option></select></label><div class="notice">Only upload content that you own or have permission/licence to distribute publicly.</div><label style="color:white"><input id="rights" type="checkbox" required> I confirm I have the necessary rights.</label><button class="primary">Publish Audio</button></form></div></div>`;$("closeUpload").onclick=closeModal;$("uploadForm").onsubmit=uploadAudio}
async function uploadAudio(e){e.preventDefault();if(!supa||!user){toast("Please login first");return}const file=$("audioFile").files[0],cover=$("coverFile").files[0],title=$("audioTitle").value.trim(),desc=$("audioDesc").value.trim(),category=$("audioCategory").value;if(!file||!title){toast("Audio and title are required");return}if(file.size>50*1024*1024){toast("Audio must be 50 MB or smaller");return}try{toast("Uploading...");const path=user.id+"/"+crypto.randomUUID()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const up=await supa.storage.from("Audio").upload(path,file,{upsert:false,contentType:file.type||"audio/mpeg"});if(up.error)throw up.error;const audioUrl=supa.storage.from("Audio").getPublicUrl(path).data.publicUrl;let coverUrl=null;if(cover){const cp=user.id+"/"+crypto.randomUUID()+"-"+cover.name.replace(/[^a-zA-Z0-9._-]/g,"_");const cu=await supa.storage.from("Covers").upload(cp,cover,{upsert:false,contentType:cover.type||"image/jpeg"});if(cu.error)throw cu.error;coverUrl=supa.storage.from("Covers").getPublicUrl(cp).data.publicUrl}const row=await supa.from("audio").insert({user_id:user.id,title,description:desc,category,visibility:"public",audio_url:audioUrl,cover_url:coverUrl});if(row.error)throw row.error;closeModal();toast("Audio published successfully")}catch(e){console.error(e);toast(e.message||"Upload failed")}}
async function renderDiscover(){page="discover";hideAll();$("home").classList.remove("hidden");navActive("discover");$("playlistTab").classList.remove("active");$("discoverTab").classList.add("active");$("homeContent").innerHTML=`<h1>Discover</h1><p class="sub">Public audio shared by AudioHub creators.</p><div class="empty">Loading...</div>`;if(!supa){$("homeContent").innerHTML=`<h1>Discover</h1><div class="empty">Community features are unavailable.</div>`;return}const{data,error}=await supa.from("audio").select("*").eq("visibility","public").order("created_at",{ascending:false});if(error){$("homeContent").innerHTML=`<h1>Discover</h1><div class="empty">Could not load community audio.</div>`;return}community=data||[];const q=query.toLowerCase().trim(),list=community.filter(x=>!q||((x.title||"")+" "+(x.description||"")+" "+(x.category||"")).toLowerCase().includes(q));$("homeContent").innerHTML=`<h1>Discover</h1><p class="sub">Public audio shared by AudioHub creators.</p>${list.length?list.map(x=>`<div class="track"><div class="cover">♪</div><div class="info"><div class="title">${esc(x.title||"Untitled")}</div><div class="meta">${esc(x.category||"Community")}</div></div><div class="actions"><button class="small" data-community-play="${esc(x.id)}">▶</button><button class="small" data-community-share="${esc(x.id)}">↗</button></div></div>`).join(""):`<div class="empty">No public community audio yet.</div>`}`;document.querySelectorAll("[data-community-play]").forEach(b=>b.onclick=()=>{const x=community.find(a=>String(a.id)===String(b.dataset.communityPlay));if(x)play({id:"community-"+x.id,title:x.title||"Untitled",sub:"Community",url:x.audio_url})});document.querySelectorAll("[data-community-share]").forEach(b=>b.onclick=async()=>{const url=location.origin+location.pathname+"?audio="+encodeURIComponent(b.dataset.communityShare);try{await navigator.clipboard.writeText(url);toast("Share link copied")}catch{prompt("Copy this link:",url)}})}
$("search").oninput=()=>{query=$("search").value;if(page==="home")renderHome();else if(page==="discover")renderDiscover();else if(page==="playlist"&&selectedPlaylist)openPlaylist(selectedPlaylist)}
$("playlistTab").onclick=()=>{ $("playlistTab").classList.add("active");$("discoverTab").classList.remove("active");renderHome() }
$("discoverTab").onclick=renderDiscover;
document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{const n=b.dataset.nav;if(n==="home")renderHome();if(n==="discover")renderDiscover();if(n==="downloads")renderDownloads();if(n==="account")renderAccount()});
$("topAccount").onclick=renderAccount;
if(supa)supa.auth.onAuthStateChange((_e,s)=>{user=s?.user||null});
(async()=>{await getUser();renderHome()})();
</script>
</body>
</html>
