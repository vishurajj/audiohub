<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">

<title>AudioHub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080b16;
  color:#fff;
  min-height:100vh;
  padding-bottom:90px;
}

header{
  padding:22px 18px 18px;
  background:linear-gradient(135deg,#10162d,#17102b);
  border-bottom:1px solid #292945;
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  font-size:28px;
  font-weight:800;
  background:linear-gradient(90deg,#8065ff,#36a8ff);
  -webkit-background-clip:text;
  color:transparent;
}

.creator{
  color:#858da7;
  font-size:12px;
  margin-top:4px;
}

.page{
  padding:22px 17px;
}

.hero{
  padding:10px 2px 22px;
}

.hero h1{
  font-size:30px;
  margin-bottom:9px;
}

.hero p{
  color:#8b93aa;
  font-size:14px;
  line-height:1.5;
}

.search{
  margin-bottom:22px;
}

.search input{
  width:100%;
  padding:15px 17px;
  border-radius:15px;
  border:1px solid #292f49;
  background:#111629;
  color:white;
  outline:none;
  font-size:14px;
}

.search input:focus{
  border-color:#735dff;
}

.section-title{
  font-size:19px;
  font-weight:700;
  margin-bottom:14px;
}

.playlists{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.playlist-card{
  width:100%;
  border:1px solid #292f49;
  background:linear-gradient(145deg,#12182b,#0e1323);
  border-radius:20px;
  padding:17px;
  display:flex;
  align-items:center;
  gap:15px;
  text-align:left;
  color:white;
  cursor:pointer;
  transition:.2s;
}

.playlist-card:active{
  transform:scale(.98);
}

.playlist-icon{
  width:64px;
  height:64px;
  flex-shrink:0;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:29px;
  background:linear-gradient(135deg,#725aff,#269cff);
}

.playlist-info{
  flex:1;
  min-width:0;
}

.playlist-name{
  font-size:17px;
  font-weight:700;
  margin-bottom:5px;
}

.playlist-desc{
  color:#8189a2;
  font-size:12px;
  line-height:1.4;
}

.arrow{
  color:#707994;
  font-size:23px;
}

.hidden{
  display:none!important;
}

/* PLAYLIST PAGE */

.playlist-page{
  display:none;
}

.back{
  border:0;
  background:#171d32;
  color:#fff;
  border:1px solid #2a3150;
  border-radius:12px;
  padding:10px 14px;
  margin-bottom:20px;
  cursor:pointer;
}

.playlist-header{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:20px;
}

.big-icon{
  width:70px;
  height:70px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  background:linear-gradient(135deg,#725aff,#269cff);
}

.playlist-header h2{
  font-size:24px;
  margin-bottom:5px;
}

.playlist-header p{
  color:#858da6;
  font-size:12px;
}

.tracks{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.track{
  background:#111629;
  border:1px solid #252b45;
  border-radius:16px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:11px;
}

.play-btn{
  width:43px;
  height:43px;
  border:0;
  border-radius:50%;
  background:linear-gradient(135deg,#765cff,#329eff);
  color:white;
  cursor:pointer;
  font-size:15px;
  flex-shrink:0;
}

.track-info{
  flex:1;
  min-width:0;
}

.track-title{
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.track-artist{
  color:#777f99;
  font-size:11px;
  margin-top:4px;
}

.fav{
  background:#191f33;
  color:#8189a0;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  font-size:17px;
  cursor:pointer;
}

.fav.active{
  color:#ff5b91;
}

.empty{
  text-align:center;
  padding:40px 15px;
  color:#777f99;
  background:#111629;
  border:1px solid #252b45;
  border-radius:16px;
}

/* PLAYER */

.player{
  position:fixed;
  left:10px;
  right:10px;
  bottom:72px;
  background:#151a2d;
  border:1px solid #303653;
  border-radius:18px;
  padding:12px;
  z-index:30;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.now{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:7px;
}

.now-icon{
  width:42px;
  height:42px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#725aff,#269cff);
}

.now-info{
  flex:1;
  min-width:0;
}

.now-title{
  font-size:13px;
  font-weight:700;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.now-artist{
  font-size:11px;
  color:#777f99;
  margin-top:3px;
}

audio{
  width:100%;
  height:38px;
}

/* NAV */

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#0d1120;
  border-top:1px solid #282e48;
  z-index:40;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

nav button{
  border:0;
  background:none;
  color:#747c95;
  font-size:11px;
  cursor:pointer;
}

nav button.active{
  color:#8068ff;
}

.nav-icon{
  display:block;
  font-size:19px;
  margin-bottom:3px;
}

.toast{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%) translateY(-80px);
  background:#1b2340;
  border:1px solid #39446b;
  color:white;
  padding:11px 16px;
  border-radius:12px;
  z-index:100;
  transition:.3s;
  font-size:12px;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<header>
  <div class="brand">AudioHub</div>
  <div class="creator">Created by Vishu raj</div>
</header>


<!-- HOME PAGE -->

<main id="homePage" class="page">

  <section class="hero">
    <h1>Listen. Learn. Grow.</h1>
    <p>
      Explore your playlists and enjoy your audio in one place.
    </p>
  </section>

  <div class="search">
    <input
      id="searchInput"
      type="search"
      placeholder="Search playlists..."
      oninput="searchPlaylists()"
    >
  </div>

  <div class="section-title">
    Your Playlists
  </div>

  <div class="playlists" id="playlistCards">

    <!-- OSHO -->

    <button
      class="playlist-card"
      data-search="osho wisdom awareness"
      onclick="openPlaylist('osho')"
    >

      <div class="playlist-icon">🧘</div>

      <div class="playlist-info">
        <div class="playlist-name">
          Osho
        </div>

        <div class="playlist-desc">
          Wisdom, awareness & inner growth
        </div>
      </div>

      <div class="arrow">›</div>

    </button>


    <!-- PREMANAND JI -->

    <button
      class="playlist-card"
      data-search="premanand ji spiritual devotional"
      onclick="openPlaylist('premanand')"
    >

      <div class="playlist-icon">🙏</div>

      <div class="playlist-info">
        <div class="playlist-name">
          Premanand Ji
        </div>

        <div class="playlist-desc">
          Spiritual talks & devotional wisdom
        </div>
      </div>

      <div class="arrow">›</div>

    </button>


    <!-- STUDY -->

    <button
      class="playlist-card"
      data-search="study time learning focus"
      onclick="openPlaylist('study')"
    >

      <div class="playlist-icon">📚</div>

      <div class="playlist-info">
        <div class="playlist-name">
          Study Time
        </div>

        <div class="playlist-desc">
          Focus, learning & study sessions
        </div>
      </div>

      <div class="arrow">›</div>

    </button>


    <!-- MOTIVATIONAL -->

    <button
      class="playlist-card"
      data-search="motivational motivation growth"
      onclick="openPlaylist('motivational')"
    >

      <div class="playlist-icon">🚀</div>

      <div class="playlist-info">
        <div class="playlist-name">
          Motivational
        </div>

        <div class="playlist-desc">
          Motivation, discipline & personal growth
        </div>
      </div>

      <div class="arrow">›</div>

    </button>

  </div>

</main>



<!-- PLAYLIST PAGE -->

<main id="playlistPage" class="page playlist-page">

  <button
    class="back"
    onclick="goHome()"
  >
    ← Back
  </button>

  <div class="playlist-header">

    <div
      class="big-icon"
      id="playlistIcon"
    >
      🎵
    </div>

    <div>
      <h2 id="playlistTitle">
        Playlist
      </h2>

      <p id="playlistDescription">
        Your playlist
      </p>
    </div>

  </div>


  <div
    id="trackList"
    class="tracks"
  ></div>

</main>



<!-- AUDIO PLAYER -->

<div class="player">

  <div class="now">

    <div class="now-icon">
      🎵
    </div>

    <div class="now-info">

      <div
        id="nowTitle"
        class="now-title"
      >
        Select an audio
      </div>

      <div
        id="nowArtist"
        class="now-artist"
      >
        AudioHub
      </div>

    </div>

  </div>

  <audio
    id="audioPlayer"
    controls
    preload="metadata"
  ></audio>

</div>



<!-- BOTTOM NAV -->

<nav>

  <button
    class="active"
    onclick="goHome()"
  >
    <span class="nav-icon">⌂</span>
    Home
  </button>

  <button
    onclick="goHome()"
  >
    <span class="nav-icon">☷</span>
    Playlists
  </button>

  <button
    onclick="showFavorites()"
  >
    <span class="nav-icon">♡</span>
    Favorites
  </button>

  <button
    onclick="showToast('More features coming soon')"
  >
    <span class="nav-icon">⋯</span>
    More
  </button>

</nav>


<div id="toast" class="toast"></div>



<script>

/* =========================================
   PLAYLIST DATA
   ========================================= */

const playlists = {

  osho: {
    title: "Osho",
    icon: "🧘",
    description: "Wisdom, awareness & inner growth",

    tracks: []

  },


  premanand: {
    title: "Premanand Ji",
    icon: "🙏",
    description: "Spiritual talks & devotional wisdom",

    tracks: []

  },


  study: {
    title: "Study Time",
    icon: "📚",
    description: "Focus, learning & study sessions",

    tracks: [

      {
        title: "Parvati Sadhu Tiwari",
        artist: "Study Audio",

        url: "https://lnhsuztjmteqrztvcigs.supabase.co/storage/v1/object/public/Audio/Parvati%20%20%20Sadhu%20Tiwari.m4a"
      }

    ]

  },


  motivational: {
    title: "Motivational",
    icon: "🚀",
    description: "Motivation, discipline & personal growth",

    tracks: []

  }

};



/* =========================================
   ELEMENTS
   ========================================= */

const homePage =
  document.getElementById("homePage");

const playlistPage =
  document.getElementById("playlistPage");

const trackList =
  document.getElementById("trackList");

const playlistTitle =
  document.getElementById("playlistTitle");

const playlistDescription =
  document.getElementById("playlistDescription");

const playlistIcon =
  document.getElementById("playlistIcon");

const audioPlayer =
  document.getElementById("audioPlayer");

const nowTitle =
  document.getElementById("nowTitle");

const nowArtist =
  document.getElementById("nowArtist");



/* =========================================
   OPEN PLAYLIST
   ========================================= */

function openPlaylist(id){

  const playlist =
    playlists[id];

  if(!playlist){
    return;
  }

  homePage.style.display = "none";

  playlistPage.style.display = "block";

  playlistTitle.textContent =
    playlist.title;

  playlistDescription.textContent =
    playlist.description;

  playlistIcon.textContent =
    playlist.icon;

  renderTracks(
    playlist.tracks
  );

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}



/* =========================================
   RENDER TRACKS
   ========================================= */

function renderTracks(tracks){

  trackList.innerHTML = "";

  if(tracks.length === 0){

    trackList.innerHTML = `
      <div class="empty">
        <div style="font-size:32px;margin-bottom:10px;">
          🎵
        </div>

        No audio added yet.

        <div style="font-size:11px;margin-top:7px;">
          Audio will appear here when added to this playlist.
        </div>
      </div>
    `;

    return;
  }


  tracks.forEach(function(track,index){

    const div =
      document.createElement("div");

    div.className = "track";

    div.innerHTML = `

      <button
        class="play-btn"
        onclick="playTrack(${index})"
      >
        ▶
      </button>

      <div class="track-info">

        <div class="track-title">
          ${escapeHTML(track.title)}
        </div>

        <div class="track-artist">
          ${escapeHTML(track.artist)}
        </div>

      </div>

      <button
        class="fav"
        onclick="toggleFavorite('${escapeHTML(track.title)}',this)"
      >
        ♡
      </button>

    `;

    trackList.appendChild(div);

  });

}



/* =========================================
   CURRENT PLAYLIST
   ========================================= */

let currentTracks = [];

function playTrack(index){

  const tracks =
    currentTracks.length
      ? currentTracks
      : getCurrentTracks();

  const track =
    tracks[index];

  if(!track){
    return;
  }

  nowTitle.textContent =
    track.title;

  nowArtist.textContent =
    track.artist;

  audioPlayer.src =
    track.url;

  audioPlayer.play()
    .catch(function(){

      showToast(
        "Press ▶ to start audio"
      );

    });

  localStorage.setItem(
    "lastPlayed",
    JSON.stringify(track)
  );

}



/* =========================================
   TRACK LIST CONNECTION
   ========================================= */

function getCurrentTracks(){

  const title =
    playlistTitle.textContent;

  for(const key in playlists){

    if(
      playlists[key].title === title
    ){

      currentTracks =
        playlists[key].tracks;

      return currentTracks;

    }

  }

  return [];

}



/* =========================================
   UPDATE CURRENT TRACKS
   ========================================= */

const originalOpenPlaylist =
  openPlaylist;


/* =========================================
   FAVORITES
   ========================================= */

function toggleFavorite(title,button){

  let favorites =
    JSON.parse(
      localStorage.getItem("favorites") || "[]"
    );

  if(favorites.includes(title)){

    favorites =
      favorites.filter(
        item => item !== title
      );

    button.classList.remove("active");

    button.textContent = "♡";

    showToast(
      "Removed from favorites"
    );

  }else{

    favorites.push(title);

    button.classList.add("active");

    button.textContent = "♥";

    showToast(
      "Added to favorites"
    );

  }

  localStorage.setItem(
    "favorites",
    JSON.stringify(favorites)
  );

}



/* =========================================
   SEARCH PLAYLISTS
   ========================================= */

function searchPlaylists(){

  const query =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  const cards =
    document.querySelectorAll(
      ".playlist-card"
    );

  cards.forEach(function(card){

    const text =
      card
        .getAttribute("data-search")
        .toLowerCase();

    if(text.includes(query)){

      card.classList.remove(
        "hidden"
      );

    }else{

      card.classList.add(
        "hidden"
      );

    }

  });

}



/* =========================================
   HOME
   ========================================= */

function goHome(){

  playlistPage.style.display =
    "none";

  homePage.style.display =
    "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}



/* =========================================
   FAVORITES BUTTON
   ========================================= */

function showFavorites(){

  const favorites =
    JSON.parse(
      localStorage.getItem(
        "favorites"
      ) || "[]"
    );

  if(favorites.length === 0){

    showToast(
      "No favorites yet"
    );

    return;
  }

  showToast(
    favorites.length +
    " favorite(s) saved"
  );

}



/* =========================================
   TOAST
   ========================================= */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  setTimeout(function(){

    toast.classList.remove(
      "show"
    );

  },2000);

}



/* =========================================
   HTML SAFETY
   ========================================= */

function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}



/* =========================================
   FIX PLAYLIST TRACK CONNECTION
   ========================================= */

const oldOpenPlaylist =
  window.openPlaylist;

window.openPlaylist =
  function(id){

    currentTracks =
      playlists[id]
        ? playlists[id].tracks
        : [];

    oldOpenPlaylist(id);

  };

</script>

</body>
</html>
